<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JS</title>
    <link rel="stylesheet" href="./main.css" />
</head>
<body>
    <div class="container">
        <h1>Exercício JS</h1>
        <h2>Validação</h2>
        <form id="form-valida">
            <input type="number" id="valor-a" required placeholder="Valor A" />
            <input type="number" id="valor-b" required placeholder="Valor B" />
            <button type="submit" id="btn-validar">Validar</button>

            <p class="error-message">O valor B deve ser maior do que o Valor A.</p>
            <p class="success-message"></p>
        </form>
    </div>
    <script src="./main.js"></script>
</body>
</html>
